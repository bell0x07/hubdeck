# hubdeck secrets - lives next to config.yaml (%APPDATA%\hubdeck\secrets.yaml). Keep it private.
#
# Format: one `name: value` per line. Quote values that contain special characters.
# Use a secret in config.yaml with the !secret tag:
#
#   plugins:
#     discord:
#       client_id: !secret discord_client_id
#       client_secret: !secret discord_client_secret
#
# Any config value can be a secret. A secret can also come from an environment
# variable named HUBDECK_<NAME>, e.g. HUBDECK_DISCORD_CLIENT_SECRET.

# Discord Developer Portal > your app > OAuth2 > Client ID
discord_client_id: "paste-your-discord-client-id-here"
# Discord Developer Portal > your app > OAuth2 > Client Secret
discord_client_secret: "paste-your-discord-client-secret-here"
