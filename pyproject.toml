[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hubdeck"
dynamic = ["version"]                 # from src/hubdeck/__init__.py
description = "Stream-Deck-style controller for the Cooler Master MasterHub modules (keys, dial, knobs, rollers, faders, RGB)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]
dependencies = [
    "hidapi>=0.14",
    "pillow>=10.1",
    "pyyaml>=6",
    "pydantic>=2.6",
    "pystray>=0.19",
    "psutil>=5.9",
    "ruamel.yaml>=0.18",
    "pycaw>=20240316; sys_platform == 'win32'",
    "comtypes>=1.4; sys_platform == 'win32'",
    "winrt-Windows.Media.Control>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2; sys_platform == 'win32'",    # async calls (.get()) in Media.Control
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-UserNotifications>=10; sys_platform == 'darwin'",
    "pyobjc-framework-ServiceManagement>=10; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/bell0x07/hubdeck"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hubdeck = "hubdeck.cli:main"

[project.gui-scripts]
hubdeck-tray = "hubdeck.tray:main"

[tool.setuptools.dynamic]
version = {attr = "hubdeck.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hubdeck = ["assets/*.yaml", "assets/tabler/*", "assets/gui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
